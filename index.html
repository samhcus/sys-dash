<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ops" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --panel: #0a0a0a;
        --border: rgba(255, 255, 255, 0.1);
        --text: #ededed;
        --label: #666666;
        --line: #7a7a7a;
        --ok: #22c55e;
        --warn: #f59e0b;
        --down: #ef4444;
        --radius: 6px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 12px;
      }

      body {
        padding: 8px;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        width: min(1600px, 100%);
        margin: 0 auto;
        display: grid;
        gap: 8px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      .telemetry {
        display: grid;
        grid-template-columns: repeat(9, minmax(0, 1fr));
        gap: 4px;
        padding: 8px 12px;
      }

      .embeds-row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 8px;
      }

      .embed-panel {
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
      }

      .embed-header {
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
      }
      .embed-attribution {
        margin-left: auto;
        font-size: 10px;
        font-weight: 400;
        color: var(--muted);
        opacity: 0.6;
      }
      .embed-attribution a {
        color: inherit;
        text-decoration: none;
      }
      .embed-attribution a:hover {
        opacity: 1;
        text-decoration: underline;
      }

      .embed-frame {
        width: 100%;
        border: none;
        background: #000;
        display: block;
      }

      @media (max-width: 900px) {
        .embeds-row { grid-template-columns: 1fr; }
      }
      @media (max-width: 1200px) and (min-width: 901px) {
        .embeds-row { grid-template-columns: 1fr 1fr; }
      }

      .telemetry-item {
        min-width: 0;
        display: grid;
        gap: 4px;
        align-content: start;
      }

      .label,
      .section-title,

      .row-spark {
        flex-shrink: 0;
        opacity: 0.6;
        vertical-align: middle;
      }

      .sparkline-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tel-sparkline {
        width: 52px;
        height: 18px;
        flex-shrink: 0;
        opacity: 0.7;
      }

      .block-title,
      .url,
      .meta-text,
      .peer-meta,
      .docker-meta {
        color: var(--label);
      }

      .value {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.1;
      }

      .sparkline {
        width: 100%;
        height: 18px;
        display: block;
      }

      .sections {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .section {
        padding: 8px 12px;
        display: grid;
        gap: 8px;
        align-content: start;
      }

      .section-title {
        font-weight: 600;
      }

      .block {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px;
        display: grid;
        gap: 6px;
      }

      .block-title {
        font-weight: 500;
      }

      .list {
        display: grid;
        gap: 4px;
      }

      .service-row,
      .peer-row,
      .docker-row {
        display: grid;
        gap: 4px;
        padding: 6px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .service-row:first-child,
      .peer-row:first-child,
      .docker-row:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .service-head,
      .peer-head,
      .docker-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .name-wrap {
        min-width: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .name {
        font-weight: 600;
        line-height: 1.2;
      }

      .agent-info {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 2px;
      }

      .provider-badge {
        font-size: 10px;
        font-family: monospace;
        padding: 1px 5px;
        border-radius: 3px;
        background: rgba(99, 102, 241, 0.15);
        color: #a5b4fc;
        border: 1px solid rgba(99, 102, 241, 0.3);
        white-space: nowrap;
      }

      .discord-badge {
        font-size: 10px;
        font-family: monospace;
        padding: 1px 5px;
        border-radius: 3px;
        white-space: nowrap;
      }

      .discord-badge.connected {
        background: rgba(34, 197, 94, 0.1);
        color: #86efac;
        border: 1px solid rgba(34, 197, 94, 0.25);
      }

      .discord-badge.offline {
        background: rgba(239, 68, 68, 0.1);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.25);
      }

      .discord-badge.unknown {
        background: rgba(107, 114, 128, 0.15);
        color: #9ca3af;
        border: 1px solid rgba(107, 114, 128, 0.3);
      }

      .tag {
        color: var(--label);
      }

      .url,
      .meta-text,
      .peer-meta,
      .docker-meta {
        line-height: 1.3;
        word-break: break-word;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--label);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      .dot.ok {
        background: var(--ok);
      }

      .dot.warn {
        background: var(--warn);
      }

      .dot.down {
        background: var(--down);
      }

      @media (max-width: 1120px) {
        .telemetry {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .sections {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 6px;
        }

        .telemetry {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .service-head,
        .peer-head,
        .docker-head {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="panel telemetry">
        <div class="telemetry-item">
          <div class="label">CPU</div>
          <div class="sparkline-wrap">
            <div id="cpu-value" class="value"></div>
            <canvas id="cpu-sparkline" class="tel-sparkline"></canvas>
          </div>
        </div>
        <div class="telemetry-item">
          <div class="label">RAM</div>
          <div class="sparkline-wrap">
            <div id="memory-value" class="value"></div>
            <canvas id="mem-sparkline" class="tel-sparkline"></canvas>
          </div>
        </div>
        <div class="telemetry-item">
          <div class="label">Disk</div>
          <div class="sparkline-wrap">
            <div id="disk-value" class="value"></div>
            <canvas id="disk-sparkline" class="tel-sparkline"></canvas>
          </div>
        </div>
        <div class="telemetry-item">
          <div class="label">Load</div>
          <div id="load-value" class="value"></div>
        </div>
        <div class="telemetry-item">
          <div class="label">Uptime</div>
          <div id="uptime-value" class="value"></div>
        </div>
        <div class="telemetry-item">
          <div class="label">Tailscale</div>
          <div id="tailscale-value" class="value"></div>
        </div>
        <div class="telemetry-item">
          <div class="label">Containers</div>
          <div id="docker-value" class="value"></div>
        </div>
        <div class="telemetry-item">
          <div class="label">Net In</div>
          <div id="net-in-value" class="value"></div>
        </div>
        <div class="telemetry-item">
          <div class="label">Net Out</div>
          <div id="net-out-value" class="value"></div>
        </div>
      </section>

      <main id="sections" class="sections"></main>
      <section id="shared-containers" class="panel section shared" style="display:none"></section>
      <div id="embeds" class="embeds-row"></div>
    </div>

    <script>
      const state = {
        cpuHistory: [],
        memHistory: [],
        diskHistory: [],
      };

      const elements = {
        sections: document.getElementById("sections"),
        shared: document.getElementById("shared-containers"),
        embeds: document.getElementById("embeds"),
        cpuValue: document.getElementById("cpu-value"),
        memoryValue: document.getElementById("memory-value"),
        diskValue: document.getElementById("disk-value"),
        loadValue: document.getElementById("load-value"),
        uptimeValue: document.getElementById("uptime-value"),
        tailscaleValue: document.getElementById("tailscale-value"),
        dockerValue: document.getElementById("docker-value"),
        netInValue: document.getElementById("net-in-value"),
        netOutValue: document.getElementById("net-out-value"),
        cpuSparkline: document.getElementById("cpu-sparkline"),
        memSparkline: document.getElementById("mem-sparkline"),
        diskSparkline: document.getElementById("disk-sparkline"),
      };

      function formatKbps(kbps) {
        if (!Number.isFinite(kbps)) return "";
        if (kbps >= 1000) return `${(kbps / 1000).toFixed(1)} Mb/s`;
        return `${kbps.toFixed(0)} kb/s`;
      }

      function formatPercent(value) {
        if (!Number.isFinite(value)) return "";
        return `${value.toFixed(1)}%`;
      }

      function formatUptime(seconds) {
        if (!Number.isFinite(seconds)) return "";
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        if (days > 0) return `${days}d ${hours}h`;
        if (hours > 0) return `${hours}h ${minutes}m`;
        return `${minutes}m`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function dotClass(ok, statusCode, fallback) {
        if (fallback === "missing") return "warn";
        if (fallback === "unavailable") return "";
        if (ok === true) return "ok";
        if (ok === false || (statusCode && statusCode >= 400)) return "down";
        return "";
      }

      function drawSparkline(canvas, values) {
        const rect = canvas.getBoundingClientRect();
        const width = Math.max(1, Math.floor(rect.width));
        const height = Math.max(1, Math.floor(rect.height));
        const dpr = window.devicePixelRatio || 1;

        canvas.width = width * dpr;
        canvas.height = height * dpr;

        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);

        const points = values.filter((value) => Number.isFinite(value));
        if (points.length < 2) return;

        ctx.strokeStyle = "#7a7a7a";
        ctx.lineWidth = 1;
        ctx.beginPath();

        points.forEach((value, index) => {
          const x = points.length === 1 ? 0.5 : (index / (points.length - 1)) * (width - 1) + 0.5;
          const y = height - ((value / 100) * (height - 2) + 1);
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });

        ctx.stroke();
      }


      function inlineSpark(values, color) {
        const pts = (values || []).filter(v => Number.isFinite(v));
        if (pts.length < 2) return "";
        const w = 44, h = 14;
        const mn = Math.min(...pts), mx = Math.max(...pts);
        const rng = mx - mn || 1;
        const coords = pts.map((v, i) => {
          const x = ((i / (pts.length - 1)) * (w - 2) + 1).toFixed(1);
          const y = (h - 1 - ((v - mn) / rng) * (h - 3)).toFixed(1);
          return `${x},${y}`;
        }).join(" ");
        return `<svg class="row-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${coords}" fill="none" stroke="${color || "#6b7280"}" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      }

      function renderServiceRow(item) {
        const ping = item.ping;
        const container = item.container;
        let headText = "";
        let dot = "";

        if (ping) {
          dot = dotClass(ping.ok, ping.statusCode);
          headText = ping.latencyMs != null ? `${ping.statusCode ?? ""} ${ping.latencyMs}ms`.trim() : (ping.statusCode || ping.error || "");
        } else if (container) {
          dot = container.status.includes("healthy") || container.status.startsWith("Up") ? "ok" : "";
          headText = container.status;
        } else if (item.expectsContainer) {
          dot = "warn";
          headText = "missing runtime";
        }

        const containerText =
          container && (container.cpu || container.memoryUsage)
            ? [container.cpu, container.memoryUsage].filter(Boolean).join(" · ")
            : "";

        return `
          <a class="service-row" href="${escapeHtml(item.href)}" target="_blank" rel="noreferrer noopener">
            <div class="service-head">
              <div class="name-wrap">
                <span class="name">${escapeHtml(item.name)}</span>
                ${item.tag ? `<span class="tag">${escapeHtml(item.tag)}</span>` : ""}
              </div>
              ${item.agentInfo ? `<div class="agent-info">
                <span class="provider-badge">${escapeHtml(item.agentInfo.provider + " / " + item.agentInfo.model + (item.agentInfo.activeAgents ? " · " + item.agentInfo.activeAgents + " agents" : ""))}</span>
                ${item.agentInfo.discord ? (() => {
                  const d = item.agentInfo.discord;
                  const stale = d.staleMinutes != null && d.staleMinutes > 120;
                  const cls = d.state === "connected" && !stale ? "connected" : d.state === "offline" ? "offline" : "unknown";
                  const label = `discord: ${d.state}` + (stale ? ` (${d.staleMinutes > 1440 ? Math.round(d.staleMinutes/1440)+'d' : Math.round(d.staleMinutes/60)+'h'} stale)` : "");
                  return `<span class="discord-badge ${escapeHtml(cls)}">${escapeHtml(label)}</span>`;
                })() : ""}
              </div>` : ""}
              <div class="status">
                ${dot ? `<span class="dot ${escapeHtml(dot)}"></span>` : ""}
                ${headText ? `<span class="meta-text">${escapeHtml(headText)}</span>` : ""}
                ${ping?.history?.length > 1 ? inlineSpark(ping.history, "#6366f1") : ""}
              </div>
            </div>
            <div class="url">${escapeHtml(item.urlLabel)}</div>
            ${containerText ? `<div class="meta-text">${escapeHtml(containerText)}</div>` : ""}
          </a>
        `;
      }

      function renderPeerRow(peer) {
        return `
          <div class="peer-row">
            <div class="peer-head">
              <div class="name-wrap">
                <span class="name">${escapeHtml(peer.name)}</span>
              </div>
              <div class="status">
                <span class="dot ${peer.online ? "ok" : "down"}"></span>
                <span class="meta-text">${peer.online ? "online" : "offline"}</span>
              </div>
            </div>
            <div class="peer-meta">${escapeHtml([peer.os, peer.ip, peer.relay].filter(Boolean).join(" · "))}</div>
          </div>
        `;
      }

      function renderDockerRow(container) {
        return `
          <div class="docker-row">
            <div class="docker-head">
              <div class="name-wrap">
                <span class="name">${escapeHtml(container.name)}</span>
              </div>
              <div class="status">
                <span class="dot ${container.status.includes("healthy") ? "ok" : container.status.startsWith("Up") ? "ok" : ""}"></span>
                <span class="meta-text">${escapeHtml(container.cpu || container.status)}</span>
                ${container.cpuHistory?.length > 1 ? inlineSpark(container.cpuHistory, "#22c55e") : ""}
              </div>
            </div>
            <div class="docker-meta">${escapeHtml(container.memoryUsage || "")}</div>
          </div>
        `;
      }

      function renderSection(section) {
        return `
          <section class="panel section ${escapeHtml(section.id)}">
            <div class="section-title">${escapeHtml(section.name)}</div>
            <div class="block">
              <div class="block-title">Links</div>
              <div class="list">${section.items.map(renderServiceRow).join("")}</div>
            </div>
            ${
              section.aiPortals && section.aiPortals.length
                ? `<div class="block"><div class="block-title">AI portals</div><div class="list">${section.aiPortals
                    .map(renderServiceRow)
                    .join("")}</div></div>`
                : ""
            }
            ${
              section.tailscalePeers && section.tailscalePeers.length
                ? `<div class="block"><div class="block-title">Tailscale devices</div><div class="list">${section.tailscalePeers
                    .map(renderPeerRow)
                    .join("")}</div></div>`
                : ""
            }
            ${
              section.docker && section.docker.length
                ? `<div class="block"><div class="block-title">Containers</div><div class="list">${section.docker
                    .map(renderDockerRow)
                    .join("")}</div></div>`
                : ""
            }
          </section>
        `;
      }

      function updateTelemetry(data) {
        elements.cpuValue.textContent = formatPercent(data.system.cpu.usagePct);
        elements.memoryValue.textContent = formatPercent(data.system.memory.usagePct);
        elements.diskValue.textContent = formatPercent(data.system.disk.usagePct);
        elements.loadValue.textContent = `${data.system.load.one.toFixed(2)} / ${data.system.load.five.toFixed(2)}`;
        elements.uptimeValue.textContent = formatUptime(data.system.uptimeSeconds);
        elements.tailscaleValue.textContent = data.tailscale.installed
          ? `${data.tailscale.backendState} · ${data.tailscale.peers.length} peers`
          : "Unavailable";
        elements.dockerValue.textContent = `${data.docker.totals.running} run · ${data.docker.totals.healthy} healthy`;
        if (data.system.network) {
          elements.netInValue.textContent = formatKbps(data.system.network.rxKbps);
          elements.netOutValue.textContent = formatKbps(data.system.network.txKbps);
        }
        state.cpuHistory = data.system.cpu.history || [];
        state.memHistory = data.system.memory.history || [];
        state.diskHistory = data.system.disk.history || [];
        drawSparkline(elements.cpuSparkline, state.cpuHistory);
        drawSparkline(elements.memSparkline, state.memHistory);
        drawSparkline(elements.diskSparkline, state.diskHistory);
      }

      function renderSharedContainers(containers) {
        if (!containers || containers.length === 0) {
          elements.shared.style.display = "none";
          return;
        }
        elements.shared.style.display = "";
        elements.shared.innerHTML = `
          <div class="section-title">Shared Containers</div>
          <div class="block">
            <div class="list">${containers.map(renderDockerRow).join("")}</div>
          </div>
        `;
      }

      function renderEmbedPanels(embeds) {
        if (!embeds || embeds.length === 0) {
          elements.embeds.innerHTML = "";
          return;
        }
        elements.embeds.innerHTML = embeds.map((embed) => `
          <div class="embed-panel panel">
            <div class="embed-header">
              <span>${escapeHtml(embed.name)}</span>
              ${embed.tag ? `<span class="tag">${escapeHtml(embed.tag)}</span>` : ""}
              ${embed.attribution ? `<span class="embed-attribution"><a href="${escapeHtml(embed.attribution.href)}" target="_blank" rel="noopener noreferrer">↗ ${escapeHtml(embed.attribution.label)}</a></span>` : ""}
            </div>
            <iframe
              class="embed-frame"
              src="${escapeHtml(embed.src)}"
              height="${embed.height}"
              loading="lazy"
              allow="clipboard-write"
              referrerpolicy="no-referrer"
            ></iframe>
          </div>
        `).join("");
      }

      async function refresh() {
        const response = await fetch("/api/metrics", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`metrics ${response.status}`);
        }

        const data = await response.json();
        updateTelemetry(data);
        elements.sections.innerHTML = data.sections.map(renderSection).join("");
        renderSharedContainers(data.docker?.groups?.shared || []);
        const embedKey = (data.embeds || []).map(e => e.id + e.src).join("|");
        if (elements.embeds.dataset.key !== embedKey) {
          elements.embeds.dataset.key = embedKey;
          renderEmbedPanels(data.embeds || []);
        }
      }

      window.addEventListener("resize", () => {
        drawSparkline(elements.cpuSparkline, state.cpuHistory);
        drawSparkline(elements.memSparkline, state.memHistory);
        drawSparkline(elements.diskSparkline, state.diskHistory);
      });

      refresh().catch(() => {});
      setInterval(() => {
        refresh().catch(() => {});
      }, 5000);
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
