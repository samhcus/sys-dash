name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-personal-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci 2>/dev/null || npm install
      - run: node --check server.js
