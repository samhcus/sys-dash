services:
  sys-dash:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.sys-dash.entryPoints=http
      - traefik.http.routers.sys-dash.rule=Host(`<YOUR_TAILSCALE_HOSTNAME>.ts.net`)
      - traefik.http.routers.sys-dash.service=sys-dash
      - traefik.http.services.sys-dash.loadbalancer.server.port=3000
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.routers.sys-dash.middlewares=gzip

networks:
  coolify:
    external: true
